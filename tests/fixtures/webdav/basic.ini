# Example WebDAV credential file (INI [basic]) for vshm webdav checks.
# Values here are placeholders, not real credentials.
# Install root:vshm mode 0640, e.g. /etc/vshm/secrets/webdav.ini
# Only used with https URLs (verified TLS); Basic is never sent over plain HTTP.
[basic]
username = vshm_monitor
password = example-only-not-a-real-secret
