# WP-10 runtime-validation fixture: healthy local HTTP check.
# Point it at a local server, e.g. `python3 -m http.server 18099 --bind 127.0.0.1`
# Run: vshm once tests/fixtures/incidents/healthy.toml /tmp/vshm-wp10-state
[agent]
host_name = "wp10-test"
interval = "1m"
timeout = "5s"
report_time = "09:00"
room_id = "!wp10test:example.org"

[[checks]]
check_id = "local-http"
type = "http"
url = "http://127.0.0.1:18099/"
expected_status = 200
interval = "1m"
timeout = "5s"
